name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install go-winres
        run: |
          go install github.com/tc-hib/go-winres@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gofmt
        run: |
          files=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$files" ]; then
            echo "not gofmt-clean:"; echo "$files"; exit 1
          fi

      # -unsafeptr is off: Win32 callbacks legitimately pass message payloads as
      # uintptr and the analyzer cannot tell them from real misuse.
      - name: Vet (windows target)
        run: GOOS=windows GOARCH=amd64 go vet -unsafeptr=false -composites=false ./...

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in v*|main|master) VERSION="0.0.0-dev" ;; esac
          make build VERSION="$VERSION"
          ls -la build/yas-shotter.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yas-shotter-windows-amd64
          path: build/yas-shotter.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp build/yas-shotter.exe dist/yas-shotter.exe
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YASShoter ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/yas-shotter.exe \
            || gh release upload "$GITHUB_REF_NAME" dist/yas-shotter.exe --clobber
