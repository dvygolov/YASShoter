name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Vet (windows target)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build
        env:
          PATH: ${{ env.PATH }}:${{ github.workspace }}/../go/bin
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          VERSION="${GITHUB_REF_NAME#v}"
          make build VERSION="${VERSION:-0.1.0}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yas-shotter-windows-amd64
          path: build/yas-shotter.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/yas-shotter.exe
          generate_release_notes: true
